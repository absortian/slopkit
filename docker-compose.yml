services:
  slopkit:
    build:
      context: .
      target: web
    image: slopkit:local
    container_name: slopkit
    restart: unless-stopped
    # Wait until the DNS is healthy before starting the web container.
    # Otherwise the PS5 may try the captive-port check while :53 is still
    # being bound and end up cached against the wrong (router) DNS.
    depends_on:
      dns:
        condition: service_healthy
    ports:
      # HOST_PORT is the port exposed on the Docker host. We deliberately use a
      # non-standard port (8080 by default) — apply your own reverse-proxy /
      # tunnel / port-forwarding layer to expose it the way you want.
      # Example: change to 9000 in .env with `HOST_PORT=9000`.
      - "${HOST_PORT:-8080}:8080"
    # Optional: bind mount for live edits without rebuilding the image.
    # Uncomment the `volumes` block below if you want hot-reload of HTML/JS
    # while developing. The bind mount overlays the COPY in the Dockerfile.
    #
    # volumes:
    #   - ./:/srv:ro
    environment:
      # PYTHONUNBUFFERED makes log output appear immediately in `docker logs`.
      - PYTHONUNBUFFERED=1

  # Captive-port DNS — answers ONLY manuals.playstation.net -> DNS_IP.
  # Listens on UDP/53 on the host IP configured in `DNS_BIND_IP` (see
  # `.env.example`) so LAN clients (PS5) can hit it without colliding with
  # the OS resolver on 127.0.0.53.
  #
  # The web container (`slopkit`, defined above) depends on this DNS with
  # `condition: service_healthy`. That guarantees the PS5 can't reach the
  # captive web server while :53 is still being bound.
  #
  # NOTE: port 53/udp is a privileged low port. The container must run with
  # capability NET_BIND_SERVICE (default for the official Docker Engine on
  # Linux) or be invoked as root. On macOS / Windows the IP:HOST:CONT syntax
  # requires Docker Desktop's "Allow privileged ports" or a TCP/UDP proxy
  # mapping a high port.
  dns:
    build:
      context: .
      target: dns
    image: slopkit-dns:local
    container_name: slopkit-dns
    restart: unless-stopped
    # No `depends_on` here: the DNS is independent of the web server and
    # shouldn't be blocked by it. Order at startup is enforced the other way
    # around — `slopkit` waits on `dns` being healthy below.
    # We deliberately do NOT use `network_mode: host` here. Reason: that mode
    # would bypass Docker's port mapping, which makes it impossible to bind the
    # DNS to a single host IP without also re-binding the OS resolver on
    # 127.0.0.53. By staying on the default bridge network we can keep the
    # system resolver untouched and only expose UDP/53 on the chosen IP.
    #
    # `DNS_BIND_IP` is the host IP that will answer port 53/udp. Set it in
    # `.env` (see `.env.example`). Defaults to 127.0.0.1 which is only useful
    # for in-host tests; for LAN use, set it to the host's primary IPv4
    # address (e.g. `hostname -I | awk '{print $1}'`).
    environment:
      - DNS_IP=${DNS_IP:-127.0.0.1}
      # IMPORTANT: no default here. The binary itself defaults
      # DNS_TARGETS to `manuals.playstation.net` when this env var is unset,
      # so omitting the default from compose means an empty/blank
      # DNS_TARGETS in your `.env` actually flows through. Otherwise an
      # operator who moves manuals to DNS_RESOLVE_TARGETS without also
      # adding an empty DNS_TARGETS= line gets the default applied and the
      # upstream lookup is silently skipped (PRIMARY bucket wins).
      - DNS_TARGETS=${DNS_TARGETS-}
      # DNS_NULL_TARGETS still has a default for backwards compatibility
      # with operators who haven't touched their `.env`. Override in `.env`
      # to silence the telemetry endpoints.
      - DNS_NULL_TARGETS=${DNS_NULL_TARGETS:-smetrics.aem.playstation.com,telemetry-console.api.playstation.com}
      # DNS_ALIAS_TARGETS — `alias=reference` pairs. The alias resolves to
      # the same IP as the reference (which MUST already be in DNS_TARGETS).
      # Defaults to empty; populate only if your console probes extra hosts.
      - DNS_ALIAS_TARGETS=${DNS_ALIAS_TARGETS:-}
      # DNS_RESOLVE_TARGETS — `alias=external_domain` pairs. The alias
      # resolves to the IP that DNS_UPSTREAM returns for the external
      # domain (cached for its TTL). Falls back to DNS_IP on upstream
      # failure. Defaults to empty.
      - DNS_RESOLVE_TARGETS=${DNS_RESOLVE_TARGETS:-}
      # DNS_UPSTREAM — host:port of the recursive resolver used by
      # DNS_RESOLVE_TARGETS. Defaults to Cloudflare (1.1.1.1:53).
      - DNS_UPSTREAM=${DNS_UPSTREAM:-1.1.1.1:53}
    ports:
      # IP:HOST:CONT format — binds ONLY on the host IP set in DNS_BIND_IP,
      # leaving 127.0.0.53 and every other interface untouched.
      # Remove the leading `${DNS_BIND_IP:-127.0.0.1}:` if you want to bind on
      # all host interfaces (less safe — collides with systemd-resolved).
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
    # Healthcheck: the binary is `scratch`-built so we cannot run shell
    # healthchecks. We invoke the same binary with a `healthcheck` subcommand
    # that validates the env-config (DNS_IP, DNS_TARGETS, DNS_NULL_TARGETS)
    # and exits 0. It does NOT bind :53 so it can run alongside the real DNS
    # process in the same container. The actual DNS listener (which never
    # exits) is the ENTRYPOINT below.
    healthcheck:
      test: ["CMD", "/dns", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s