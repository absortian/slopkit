services:
  slopkit:
    build:
      context: .
      target: web
    image: slopkit:local
    container_name: slopkit
    restart: unless-stopped
    ports:
      # HOST_PORT is the port exposed on the Docker host. We deliberately use a
      # non-standard port (8080 by default) — apply your own reverse-proxy /
      # tunnel / port-forwarding layer to expose it the way you want.
      # Example: change to 9000 in .env with `HOST_PORT=9000`.
      - "${HOST_PORT:-8080}:8080"
    # Optional: bind mount for live edits without rebuilding the image.
    # Uncomment the `volumes` block below if you want hot-reload of HTML/JS
    # while developing. The bind mount overlays the COPY in the Dockerfile.
    #
    # volumes:
    #   - ./:/srv:ro
    environment:
      # PYTHONUNBUFFERED makes log output appear immediately in `docker logs`.
      - PYTHONUNBUFFERED=1

  # Captive-port DNS — answers ONLY manuals.playstation.net -> DNS_IP.
  # Listens on UDP/53 on the host IP configured in `DNS_BIND_IP` (see
  # `.env.example`) so LAN clients (PS5) can hit it without colliding with
  # the OS resolver on 127.0.0.53.
  #
  # `depends_on: [slopkit]` guarantees the DNS container is created (and
  # usually started) before the web one. Without this the web server can be
  # fully reachable while the DNS is still racing to bind :53 — the PS5 does
  # its captive-port check the moment it gets an IP and won't retry for
  # several minutes.
  #
  # NOTE: port 53/udp is a privileged low port. The container must run with
  # capability NET_BIND_SERVICE (default for the official Docker Engine on
  # Linux) or be invoked as root. On macOS / Windows the IP:HOST:CONT syntax
  # requires Docker Desktop's "Allow privileged ports" or a TCP/UDP proxy
  # mapping a high port.
  dns:
    build:
      context: .
      target: dns
    image: slopkit-dns:local
    container_name: slopkit-dns
    restart: unless-stopped
    depends_on:
      - slopkit
    # We deliberately do NOT use `network_mode: host` here. Reason: that mode
    # would bypass Docker's port mapping, which makes it impossible to bind the
    # DNS to a single host IP without also re-binding the OS resolver on
    # 127.0.0.53. By staying on the default bridge network we can keep the
    # system resolver untouched and only expose UDP/53 on the chosen IP.
    #
    # `DNS_BIND_IP` is the host IP that will answer port 53/udp. Set it in
    # `.env` (see `.env.example`). Defaults to 127.0.0.1 which is only useful
    # for in-host tests; for LAN use, set it to the host's primary IPv4
    # address (e.g. `hostname -I | awk '{print $1}'`).
    environment:
      - DNS_IP=${DNS_IP:-127.0.0.1}
    ports:
      # IP:HOST:CONT format — binds ONLY on the host IP set in DNS_BIND_IP,
      # leaving 127.0.0.53 and every other interface untouched.
      # Remove the leading `${DNS_BIND_IP:-127.0.0.1}:` if you want to bind on
      # all host interfaces (less safe — collides with systemd-resolved).
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"