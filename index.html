<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
  }
  #cat {
    box-sizing: border-box; width: 150px; height: 150px; object-fit: cover;
    max-width: 34vw; max-height: 34vw;
    border: 4px solid #343c49; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }

  #actions {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
  }

  /* --- Pure CSS buttons -------------------------------------------------- */
  .btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    box-sizing: border-box;
    min-width: 240px;
    padding: 18px 32px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 14px;
    color: #fff;
    font: 700 19px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 40%),
      linear-gradient(135deg, #3b8cff, #1957c8);
    box-shadow:
      0 14px 32px rgba(18, 79, 190, 0.35),
      inset 0 1px rgba(255, 255, 255, 0.25),
      inset 0 -2px rgba(0, 0, 0, 0.25);
    transition:
      transform .12s ease,
      box-shadow .15s ease,
      border-color .15s ease,
      filter .15s ease;
    overflow: hidden;
  }
  /* Subtle moving sheen */
  .btn::before {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.18) 50%,
      rgba(255, 255, 255, 0) 100%);
    transform: skewX(-20deg);
    transition: left .55s ease;
    pointer-events: none;
  }
  .btn:hover::before { left: 130%; }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus {
    outline: none;
    border-color: #fff;
    box-shadow:
      0 0 0 4px rgba(91, 158, 255, 0.35),
      0 18px 40px rgba(18, 79, 190, 0.45),
      inset 0 1px rgba(255, 255, 255, 0.3);
  }
  .btn:active { transform: translateY(1px); }

  .btn .ico {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px;
    flex: 0 0 22px;
  }
  .btn .ico svg { width: 100%; height: 100%; display: block; }

  /* Variants */
  .btn--done,
  .btn[disabled] {
    color: #effff4;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 40%),
      linear-gradient(135deg, #239d52, #126531);
    border-color: rgba(123, 255, 162, 0.55);
    box-shadow:
      0 14px 32px rgba(24, 142, 67, 0.30),
      inset 0 1px rgba(255, 255, 255, 0.25);
    pointer-events: none;
    filter: saturate(1.05);
  }

  #status { min-height: 1.5em; color: #9fb1c3; font-size: 18px; }

  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="cat" src="slopkit/cat.jpg" alt="">
  <div id="actions">
    <a id="start" class="btn"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
       tabindex="0">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
      </span>
      <span>RUN</span>
    </a>
  </div>
  <div id="status"></div>
</div>

<script>try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

</body>
</html>
