<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<link rel="preload" href="slopkit/cat-cooking.gif" as="image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(circle at 50% -12%, rgba(255, 161, 74, 0.13), rgba(255, 161, 74, 0) 46%),
      radial-gradient(circle at 50% 32%, #182640 0, #0c1322 46%, #05070c 100%);
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
  }

  #brand {
    font: 800 34px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .34em; text-indent: .34em;
    color: #f2f6ff;
    text-shadow: 0 2px 22px rgba(94, 179, 255, 0.28);
  }
  #tagline {
    margin-top: -12px;
    font: 700 12px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .30em; text-indent: .30em;
    text-transform: uppercase;
    color: #e0a75e;
  }

  #cat {
    box-sizing: border-box; width: 160px; height: 160px; object-fit: cover;
    max-width: 36vw; max-height: 36vw;
    border: 4px solid #3a4356; border-radius: 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 34px rgba(255,161,74,.12);
  }
  #catCaption {
    margin-top: -8px;
    font: 600 14px/1.3 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .06em;
    color: #8fa1b3;
    text-align: center;
    min-height: 1.3em;
  }

  #actions {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
  }

  /* --- The PNG is the button. The anchor only provides a focus frame ------ */
  .btn {
    display: block;
    box-sizing: border-box;
    padding: 6px;
    border: 3px solid transparent;
    border-radius: 30px;
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    transition:
      transform .12s ease,
      border-color .15s ease,
      box-shadow .15s ease;
  }
  .btn img {
    display: block;
    width: 320px; max-width: 64vw; height: auto;
    border: 0;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus {
    outline: none;
    border-color: #fff;
    box-shadow: 0 0 24px rgba(91, 158, 255, 0.32);
  }
  .btn:active { transform: translateY(1px); }

  #status {
    min-height: 1.5em;
    color: #5f6b7d;
    font-size: 13px; font-weight: 600;
    letter-spacing: .10em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="brand">SLOPKIT</div>
  <div id="tagline">fine dining for your console</div>
  <img id="cat" src="slopkit/cat.jpg" alt="the chef">
  <div id="catCaption">the chef is waiting for your order</div>
  <div id="actions">
    <a id="start" class="btn"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
       tabindex="0">
      <img src="slopkit/buttons/button-run.png" width="320" height="86" border="0" alt="Run">
    </a>
  </div>
  <div id="status">no refunds if the kitchen catches fire</div>
</div>

<script>try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

</body>
</html>
